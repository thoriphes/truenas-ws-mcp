[project]
name = "truenas-ws-mcp"
version = "0.1.0"
description = "TrueNAS MCP server using WebSocket API"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "websockets>=13.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
truenas-ws-mcp = "truenas_ws_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truenas_ws_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
